const TRAILER="\u003c!DOCTYPE html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003cmeta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n\u003ctitle>Meteor 60 Seconds — Trailer\u003c/title>\n\u003cstyle>\n:root{--bg:#0d0b22;--fg:#fff;--ac:#ffb300;--rd:#e53935;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){--bg:#0d0b22}}\n:root[data-theme=\"dark\"]{--bg:#0d0b22}\nhtml,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:Impact,\"Arial Black\",system-ui,sans-serif}\nbody{display:grid;place-items:center}body.run{cursor:none}\n#stage{container-type:size;position:relative;width:min(100vw,calc((100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))*16/9));aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#05040f,#1d1450 75%,#3a1d4a)}\n#stars{position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#fff9,transparent),radial-gradient(1.5px 1.5px at 150px 60px,#fff,transparent),radial-gradient(1px 1px at 60px 170px,#fffb,transparent);background-size:180px 200px;opacity:.7}\n#cv{position:absolute;inset:0;width:100%;height:100%}\n#scene{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center}\n#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,#000a),repeating-linear-gradient(#0000 0 .4cqw,#0000000d .4cqw .5cqw)}\n#bars{position:absolute;inset:0;pointer-events:none;border-top:5cqw solid #000;border-bottom:5cqw solid #000;box-sizing:border-box}\n.t{font-size:8.5cqw;line-height:1;color:var(--ac);text-shadow:.45cqw .45cqw 0 var(--rd);-webkit-text-stroke:.2cqw #111;paint-order:stroke fill}\n.sub{font-size:3.2cqw;color:var(--fg);margin-top:1.5cqw;letter-spacing:.1cqw}\n.pop{animation:pop .35s cubic-bezier(.2,1.6,.4,1) both}\n@keyframes pop{from{transform:scale(.3) rotate(-7deg);opacity:0}to{transform:none;opacity:1}}\n@keyframes fade{from{opacity:0}to{opacity:1}}\n@keyframes up{from{transform:translateY(3cqw);opacity:0}to{transform:none;opacity:1}}\n@keyframes shk{20%{transform:translate(-1cqw,.6cqw)}40%{transform:translate(1cqw,-.6cqw)}60%{transform:translate(-.6cqw,-.4cqw)}80%{transform:translate(.5cqw,.5cqw)}}\n@keyframes gl{0%{text-shadow:.6cqw 0 #0ff,-.6cqw 0 var(--rd)}50%{text-shadow:-.4cqw .2cqw #0ff,.4cqw -.2cqw var(--rd)}}\n.gl{animation:pop .35s both,gl .16s steps(2) infinite}\n.news{width:84cqw;text-align:left}\n.tag{display:inline-block;background:var(--rd);color:#fff;font-size:3cqw;padding:.6cqw 2cqw;border:.25cqw solid #111;animation:blink 1s steps(2) infinite}\n@keyframes blink{50%{background:#8e1c1a}}\n.line{margin-top:2.5cqw;font-size:5.2cqw;line-height:1.15;background:#000a;border-left:1cqw solid var(--ac);padding:2cqw 3cqw}\n.line span{display:inline-block;opacity:0;animation:up .3s forwards}\n.tick{position:absolute;left:0;right:0;bottom:5cqw;background:var(--rd);font-size:2.6cqw;padding:.8cqw 0;white-space:nowrap;overflow:hidden;text-align:left}\n.tick b{display:inline-block;font-weight:400;padding-left:100cqw;animation:mq 9s linear infinite}\n@keyframes mq{to{transform:translateX(-100%)}}\n.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle,hsl(var(--h) 80% 45%/.4),transparent 70%)}\n.card .ghost{position:absolute;font-size:26cqw;line-height:.9;color:transparent;-webkit-text-stroke:.25cqw hsl(var(--h) 90% 65%/.3);white-space:nowrap;animation:drift 3s linear both}\n@keyframes drift{from{transform:translateX(5cqw)}to{transform:translateX(-5cqw)}}\n.card .t{position:relative;font-size:10cqw;animation:pop .3s cubic-bezier(.2,1.6,.4,1) both}\n.card .tg{position:relative;margin-top:2cqw;background:var(--ac);color:#111;font-size:3.2cqw;padding:.5cqw 2cqw;transform:skew(-8deg);border:.25cqw solid #111;animation:up .35s .1s both}\n.slab{position:absolute;left:-10cqw;top:0;bottom:0;width:66cqw;background:hsl(var(--h) 70% 28%/.85);clip-path:polygon(0 0,100% 0,78% 100%,0 100%)}\n.v1{align-items:flex-start;padding-left:8cqw;text-align:left}.v1 .t{font-size:12cqw;line-height:.95}\n.v2 .t{font-size:13cqw;line-height:.92}\n.wipe{position:absolute;top:0;bottom:0;width:30cqw;background:var(--ac);transform:skew(-15deg);animation:wipe .3s ease-in both}\n@keyframes wipe{from{left:-40cqw}to{left:120cqw}}\n.ctr{position:absolute;left:4cqw;bottom:7cqw;font-size:2.4cqw;letter-spacing:.2cqw;opacity:.85}\n.calm{background:radial-gradient(circle,#ffb3001a,transparent 65%);animation:fade 1.2s both}\n.calm .t{font-size:3cqw;color:var(--fg);-webkit-text-stroke:0;text-shadow:none;letter-spacing:.6cqw;opacity:.7;animation:none}\n.calm q{display:block;margin-top:2cqw;max-width:70cqw;font:italic 400 6.2cqw/1.15 Georgia,serif;animation:up 1s .3s both}\n.calm .who{margin-top:1.6cqw;font-size:2.6cqw;color:var(--ac);animation:fade 1s .9s both}\n.num{font-size:34cqw;animation:pop .3s both}\n.end .t{font-size:11cqw}.end .cr{margin-top:2cqw;font-size:2.4cqw;opacity:.75;font-family:system-ui,sans-serif;letter-spacing:.1cqw}\n#hud{position:absolute;top:7cqw;right:3cqw;font-size:4cqw;text-shadow:.25cqw .25cqw 0 #111;opacity:0}\n#hud.r{color:var(--rd);animation:blink2 .5s steps(2) infinite}@keyframes blink2{50%{opacity:.4}}\n#fl{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}\n@keyframes fl{from{opacity:1}to{opacity:0}}\n#ov{position:fixed;inset:0;background:#0d0b22f2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}\n#ov h1{font-size:clamp(30px,8vw,64px);margin:0;font-weight:400;color:var(--ac);text-shadow:3px 3px 0 var(--rd)}\n#ov p{margin:0;max-width:46ch;font-family:system-ui,sans-serif;font-size:15px;line-height:1.5;opacity:.85}\nbutton{font:clamp(18px,4vw,26px) Impact,\"Arial Black\",sans-serif;background:var(--ac);color:#111;border:3px solid #111;border-radius:10px;padding:.4em 1em;box-shadow:3px 3px 0 #111;cursor:pointer}\nbutton:focus-visible{outline:3px solid var(--rd);outline-offset:3px}\n\u003c/style>\u003c/head>\u003cbody>\n\u003cdiv id=\"stage\">\u003cdiv id=\"stars\">\u003c/div>\u003ccanvas id=\"cv\">\u003c/canvas>\u003cdiv id=\"scene\">\u003c/div>\u003cdiv id=\"hud\">\u003c/div>\u003cdiv id=\"vig\">\u003c/div>\u003cdiv id=\"bars\">\u003c/div>\u003cdiv id=\"fl\">\u003c/div>\u003c/div>\n\u003cdiv id=\"ov\">\u003ch1>METEOR 60 SECONDS\u003cbr>TRAILER\u003c/h1>\n\u003cp>A 60-second animated trailer. Start your screen recorder first (include tab audio for sound), then press Play. Fullscreen works best.\u003c/p>\n\u003cbutton id=\"go\">PLAY\u003c/button>\n\u003cp>Space: play / replay · F: fullscreen · M: mute\u003c/p>\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s),sc=$('#scene'),hud=$('#hud'),fl=$('#fl');\nlet ac,mute=false,run=false,t0=0,cur=-1,beat=-1,P=[],lt=0;\n/* ---------- audio ---------- */\nfunction tone(f,d=.2,ty='sine',v=.12,dl=0,f2){if(!ac||mute)return;const t=ac.currentTime+dl,o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}\nfunction noise(d,v){if(!ac||mute)return;const n=ac.sampleRate*d,b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i\u003cn;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=900;g.gain.value=v;s.buffer=b;s.connect(f).connect(g).connect(ac.destination);s.start()}\nfunction riser(d){if(!ac||mute)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.setValueAtTime(80,t);o.frequency.exponentialRampToValueAtTime(1400,t+d);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.09,t+d);g.gain.linearRampToValueAtTime(0,t+d+.05);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.1)}\nconst shake=()=>{sc.style.animation='none';void sc.offsetWidth;sc.style.animation='shk .3s'};\nconst fx={siren:()=>{for(let i=0;i\u003c5;i++)tone(i%2?700:900,.45,'sawtooth',.035,i*.5)},\nhit:()=>{shake();tone(160,.15,'square',.1,0,55);tone(1300,.05,'square',.03)},\ntick:p=>tone(p||880,.09,'square',.06),\nchime:()=>{[523,659,784,1047].forEach((f,i)=>tone(f,.9,'sine',.07,i*.18))},\nboom:()=>{tone(100,2,'sine',.6,0,28);noise(1.8,.7)}};\n/* ---------- meteor sprite (procedural rock) ---------- */\nconst W=1280,H=720,cv=$('#cv'),g=cv.getContext('2d');cv.width=W;cv.height=H;\nconst hs=(x,y)=>{const n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n)};\nconst vn=(x,y)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy);return hs(i,j)*(1-u)*(1-v)+hs(i+1,j)*u*(1-v)+hs(i,j+1)*(1-u)*v+hs(i+1,j+1)*u*v};\nconst fbm=(x,y)=>{let s=0,a=.5;for(let o=0;o\u003c4;o++){s+=a*vn(x,y);x*=2.1;y*=2.1;a*=.5}return s};\nconst CR=[[-.3,-.2,.28],[.35,.25,.22],[.1,.5,.16],[-.45,.35,.14],[.4,-.4,.15],[0,-.05,.1],[-.1,-.55,.12]];\nconst Hh=(u,v)=>{let h=fbm(u*3+5,v*3+5)*.5;for(const c of CR){const d=Math.hypot(u-c[0],v-c[1])/c[2];if(d\u003c1.4){if(d\u003c1)h-=(1-d*d)*.35;h+=Math.exp(-Math.pow((d-1)*4,2))*.12}}return h};\nfunction rock(){const S=360,c=document.createElement('canvas');c.width=c.height=S;const x=c.getContext('2d'),im=x.createImageData(S,S),D=im.data,L=[-.5,-.6,.65],ll=Math.hypot(...L),dx=-.82,dy=.58;\nfor(let y=0;y\u003cS;y++)for(let X=0;X\u003cS;X++){const u=X/S*2-1,v=y/S*2-1,d=Math.hypot(u,v),an=Math.atan2(v,u),ed=.84+.12*fbm(Math.cos(an)*1.6+9,Math.sin(an)*1.6+9),k=d/ed;if(k>=1)continue;\nlet nx=u/ed,ny=v/ed,nz=Math.sqrt(Math.max(0,1-nx*nx-ny*ny)),e=.012,hx=(Hh(u+e,v)-Hh(u-e,v))/(2*e),hy=(Hh(u,v+e)-Hh(u,v-e))/(2*e);\nnx-=hx*.22;ny-=hy*.22;nz+=.25;const nl=Math.hypot(nx,ny,nz);nx/=nl;ny/=nl;nz/=nl;\nconst lam=Math.max(0,(nx*L[0]+ny*L[1]+nz*L[2])/ll),tx=fbm(u*9+40,v*9+40),b=.22+lam*1.05;\nlet r=(70+50*tx)*b,gg=(58+40*tx)*b,bl=(52+34*tx)*b;\nconst lead=Math.max(0,(u*dx+v*dy)/ed),gl=Math.pow(lead,1.8),cr=Math.pow(1-Math.abs(fbm(u*5+20,v*5+20)*2-1),14),em=gl*1.1+cr*(.35+gl)+Math.pow(k,5)*.3;\nr+=255*em;gg+=120*em;bl+=25*em;const i=(y*S+X)*4;D[i]=Math.min(255,r);D[i+1]=Math.min(255,gg);D[i+2]=Math.min(255,bl);D[i+3]=Math.min(1,(1-k)*25)*255}\nx.putImageData(im,0,0);return c}\nconst RK=rock();\nconst glow=(r,gr,b)=>{const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d'),q=x.createRadialGradient(32,32,0,32,32,32);q.addColorStop(0,`rgba(${r},${gr},${b},1)`);q.addColorStop(1,`rgba(${r},${gr},${b},0)`);x.fillStyle=q;x.fillRect(0,0,64,64);return c};\nconst GS=[glow(255,240,200),glow(255,140,30),glow(200,40,20)];\nconst SKY=(()=>{const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#07061a';let px=-10,i=0;while(px\u003cW){const w=40+hs(i,1)*55,h=50+hs(i,2)*190;x.fillRect(px,H-50-h,w,h+50);for(let wx=px+6;wx\u003cpx+w-8;wx+=12)for(let wy=H-50-h+8;wy\u003cH-58;wy+=14)if(hs(wx,wy)\u003c.22){x.fillStyle='#ffcf66';x.fillRect(wx,wy,5,7)}x.fillStyle='#07061a';px+=w+hs(i,3)*8;i++}x.fillRect(0,H-50,W,50);return c})();\nfunction draw(t,dt){const p=Math.min(t/58,1);g.globalCompositeOperation='source-over';g.clearRect(0,0,W,H);\nconst ga=.05+.55*p*p,q=g.createRadialGradient(W/2,H,0,W/2,H,W*.75);q.addColorStop(0,`rgba(255,110,30,${ga})`);q.addColorStop(1,'rgba(255,110,30,0)');g.fillStyle=q;g.fillRect(0,0,W,H);\ng.drawImage(SKY,0,0);if(t>=58)return;\nconst mx=980-p*340,my=120+p*260,r=8+Math.pow(p,3.4)*520;\nfor(let k=0;k\u003c5;k++)P.push({x:mx+(Math.random()-.5)*r*.6,y:my+(Math.random()-.5)*r*.6,vx:.82*r*1.4*(.5+Math.random()),vy:-.58*r*1.4*(.5+Math.random()),s:r*(.7+Math.random()*.7),a:0,l:.9+Math.random()*.6});\nif(P.length>380)P.splice(0,P.length-380);\ng.globalCompositeOperation='lighter';\nP=P.filter(o=>(o.a+=dt)\u003co.l);for(const o of P){o.x+=o.vx*dt;o.y+=o.vy*dt;const f=o.a/o.l;g.globalAlpha=(1-f)*.5*(1-.4*p);const s=o.s*(1+f);g.drawImage(GS[f\u003c.25?0:f\u003c.6?1:2],o.x-s/2,o.y-s/2,s,s)}\ng.globalAlpha=.4;g.drawImage(GS[1],mx-r*2.5,my-r*2.5,r*5,r*5);g.globalAlpha=1;g.globalCompositeOperation='source-over';g.drawImage(RK,mx-r,my-r,r*2,r*2)}\n/* ---------- content ---------- */\nconst MONT=[['Best Friend','Give a good dog a bone.'],['Last Kiss','Bring her flowers.'],['Call Mom','Pick up the phone.'],['Bad Neighbor','Bonk a few people.'],['Breaking News','Hijack the broadcast.'],['Last Supper','Pizza. Coffee. Dancing.'],['Last Train','Ride the subway.'],['Town Brawler','Floor the guard.'],['Lone Survivor','Escape alone.'],['Hero of Earth','Fly the bomb in.'],['Moon Breaker','Oops.'],['Friend Zone','No flowers. Ouch.'],['Last Good Deed','Just be kind.'],['Stone Cold','Skip a stone. Far.']];\nconst CALM=[['Apple Tree','Uncle, can I have an apple?','your nephew'],['Sweet Dreams','You slept… inside a VR game?','Mom'],['Fourth Wall','You paused the apocalypse and poked it. It blinked.','the game']];\nconst words=s=>s.split(' ').map((w,i)=>`\u003cspan style=\"animation-delay:${i*.13}s\">${w}\u003c/span>`).join(' ');\nconst news=s=>`\u003cdiv class=\"news\">\u003cdiv class=\"tag\">BREAKING NEWS\u003c/div>\u003cdiv class=\"line\">${words(s)}\u003c/div>\u003c/div>\u003cdiv class=\"tick\">\u003cb>METEOR ON COLLISION COURSE + IMPACT IN 60 SECONDS + DO NOT PANIC + METEOR ON COLLISION COURSE + IMPACT IN 60 SECONDS +\u003c/b>\u003c/div>`;\nconst card=(c,i)=>{const v=i%3,nm=c[0].split(' ');return`\u003cdiv class=\"card v${v}\" style=\"--h:${(i*47)%360}\">\u003cdiv class=\"ghost\">${c[0].toUpperCase()}\u003c/div>${v==1?'\u003cdiv class=\"slab\">\u003c/div>':''}\u003cdiv class=\"t\">${v==0?c[0]:nm.join('\u003cbr>')}\u003c/div>\u003cdiv class=\"tg\">${c[1]}\u003c/div>\u003cdiv class=\"ctr\">ENDING ${String(i+1).padStart(2,'0')} OF 18\u003c/div>\u003cdiv class=\"wipe\">\u003c/div>\u003c/div>`};\nconst T=[],add=(s,e,h,f)=>T.push({s,e,h,f});\nadd(0,2.4,news('We interrupt this broadcast with breaking news.'),fx.siren);\nadd(2.4,5,news('NASA confirms a massive meteor is on a collision course with Earth.'),fx.hit);\nadd(5,8,news('Impact in exactly… sixty seconds.'),fx.hit);\nadd(8,11,'\u003cdiv class=\"t gl\">SIXTY\u003cbr>SECONDS.\u003c/div>',()=>{fx.hit();fx.tick(440)});\nadd(11,14,'\u003cdiv class=\"pop\">\u003cdiv class=\"t\">DO WHATEVER\u003cbr>YOU WANT.\u003c/div>\u003cdiv class=\"sub\">(even the illegal stuff)\u003c/div>\u003c/div>',fx.hit);\nconst w=MONT.map((_,i)=>2-1.2*i/12),ws=w.reduce((a,b)=>a+b);let ts=14;\nMONT.forEach((c,i)=>{const d=w[i]/ws*26;add(ts,ts+d,card(c,i),fx.hit);ts+=d});\nCALM.forEach((c,i)=>add(40+i*10/3,40+(i+1)*10/3,`\u003cdiv class=\"card calm\">\u003cdiv class=\"t\">${c[0].toUpperCase()}\u003c/div>\u003cq>${c[1]}\u003c/q>\u003cdiv class=\"who\">${c[2]}\u003c/div>\u003c/div>`,fx.chime));\nadd(50,53,'\u003cdiv class=\"t pop\">WHAT WILL\u003cbr>YOU DO?\u003c/div>',()=>{fx.tick(330);riser(8)});\n[5,4,3,2,1].forEach((n,i)=>add(53+i,54+i,`\u003cdiv class=\"t num\">${n}\u003c/div>`,()=>{fx.tick(440+i*110);shake()}));\nadd(58,62,'\u003cdiv class=\"end pop\">\u003cdiv class=\"t\">METEOR\u003cbr>60 SECONDS!\u003c/div>\u003cdiv class=\"sub\">FAN TRIBUTE\u003c/div>\u003cdiv class=\"cr\">Inspired by the game by AvoCavo\u003c/div>\u003c/div>',()=>{fl.style.animation='none';void fl.offsetWidth;fl.style.animation='fl 1.4s forwards';fx.boom()});\n/* ---------- player ---------- */\nconst bass=[110,110,165,147];\nfunction loop(){if(!run)return;const t=(performance.now()-t0)/1000,dt=Math.min(.05,t-lt);lt=t;\nlet i=T.findIndex(x=>t>=x.s&&t\u003cx.e);if(i\u003c0)i=T.length-1;\nif(i!==cur){cur=i;sc.innerHTML=T[i].h;T[i].f()}\nconst b=Math.floor(t*2);if(b!==beat){beat=b;if(t\u003c14||(t>
