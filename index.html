<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CCStudios Arcade</title>
<meta name="description" content="Games by Cousin Crew Studios. Play in your browser.">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307080d'/%3E%3Cpath d='M28 20a12 12 0 1 0 0 24' fill='none' stroke='%23ffb547' stroke-width='6' stroke-linecap='round'/%3E%3Cpath d='M46 20a12 12 0 1 0 0 24' fill='none' stroke='%2353d5ff' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #07080d;
    --bg-2: #0d1018;
    --panel: #121622;
    --panel-2: #181d2b;
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .14);
    --text: #eef1f8;
    --muted: #8c94a8;
    --dim: #5d6478;
    --amber: #ffb547;
    --cyan: #53d5ff;
    --radius: 14px;
    --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 600px at 85% -10%, rgba(83, 213, 255, .08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(255, 181, 71, .07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 15px/1.5 var(--body);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body.playing { overflow: hidden; }
  button { font: inherit; color: inherit; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  /* starfield */
  .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .55;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 72% 8%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 38% 62%, #cfe8ff 50%, transparent 51%),
      radial-gradient(1px 1px at 88% 44%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 55% 30%, #ffe3b0 50%, transparent 51%),
      radial-gradient(1px 1px at 22% 84%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 64% 92%, #cfe8ff 50%, transparent 51%),
      radial-gradient(1px 1px at 94% 76%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 6% 52%, #fff 50%, transparent 51%);
    background-size: 640px 640px;
  }

  .wrap { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 24px 64px; }

  /* header */
  header.top { display: flex; align-items: center; gap: 20px; padding: 22px 0 18px; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; }
  .mark { width: 40px; height: 40px; border-radius: 11px; background: var(--panel-2); border: 1px solid var(--line-2);
    display: grid; place-items: center; flex: none; }
  .brand h1 { margin: 0; font: 700 18px/1.1 var(--display); letter-spacing: .14em; text-transform: uppercase; }
  .brand h1 span { color: var(--amber); }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12.5px; letter-spacing: .04em; }

  .search { position: relative; flex: 0 1 320px; min-width: 200px; }
  .search input { width: 100%; height: 40px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--bg-2);
    color: var(--text); padding: 0 40px 0 38px; font: inherit; outline: none; transition: border-color .15s, background .15s; }
  .search input::placeholder { color: var(--dim); }
  .search input:focus { border-color: rgba(83, 213, 255, .55); background: var(--panel); }
  .search svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; color: var(--dim); }
  .search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 600 11px/1 var(--body); color: var(--dim);
    border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 6px; }

  .seg { display: inline-flex; background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; height: 40px; }
  .seg button { border: 0; background: none; padding: 0 12px; border-radius: 7px; cursor: pointer; color: var(--muted);
    font-size: 13px; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--text); box-shadow: inset 0 0 0 1px var(--line-2); }

  /* hero */
  .hero { position: relative; display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0;
    border-radius: 20px; overflow: hidden; background: var(--panel); border: 1px solid var(--line); margin: 6px 0 40px;
    min-height: 340px; }
  .hero .media { position: relative; min-height: 260px; }
  .hero .media::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 55%, var(--panel) 100%); }
  .hero .info { padding: 36px 36px 32px 20px; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
  .eyebrow { font: 700 11.5px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
  .hero h2 { margin: 0; font: 800 clamp(28px, 3.6vw, 44px)/1.02 var(--display); letter-spacing: -.01em; text-wrap: balance; }
  .hero p { margin: 0; color: var(--muted); font-size: 15.5px; max-width: 46ch; }
  .hero .actions { display: flex; gap: 10px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
  .btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; border-radius: 11px;
    border: 1px solid var(--line-2); background: var(--panel-2); cursor: pointer; font-weight: 700; text-decoration: none;
    transition: transform .12s, background .15s, border-color .15s; }
  .btn:hover { border-color: rgba(255, 255, 255, .28); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--amber); color: #1a1205; border-color: transparent; }
  .btn.primary:hover { background: #ffc46b; }
  .meta { color: var(--dim); font-size: 13px; }

  /* section */
  .bar { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
  .bar h3 { margin: 0; font: 700 13px/1 var(--display); letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  .bar h3 b { color: var(--text); font-weight: 700; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
  .card { position: relative; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; cursor: pointer; text-align: left; padding: 0;
    transition: transform .18s cubic-bezier(.2, .8, .2, 1), border-color .18s, box-shadow .18s; }
  .card:hover, .card:focus-visible { transform: translateY(-3px); border-color: rgba(255, 181, 71, .45);
    box-shadow: 0 14px 40px -12px rgba(0, 0, 0, .7), 0 0 0 1px rgba(255, 181, 71, .15); }
  .card .media { aspect-ratio: 16 / 9; }
  .card .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .card h4 { margin: 0; font: 700 17px/1.2 var(--display); }
  .by { color: var(--cyan); font-size: 12.5px; font-weight: 600; text-decoration: none; }
  a.by:hover { text-decoration: underline; }
  .card .by { margin-top: -3px; }
  .hero .by { font-size: 14px; }
  .pbar .by { font-size: 12.5px; white-space: nowrap; }
  .card p { margin: 0; color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .foot { margin-top: auto; padding-top: 8px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11.5px; font-weight: 600; color: var(--muted); background: rgba(255, 255, 255, .05); border: 1px solid var(--line);
    padding: 2px 8px; border-radius: 99px; }
  .card .when { margin-left: auto; color: var(--dim); font-size: 12px; }
  .play-hint { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transition: opacity .18s;
    background: rgba(7, 8, 13, .35); }
  .play-hint span { width: 58px; height: 58px; border-radius: 50%; background: var(--amber); display: grid; place-items: center;
    box-shadow: 0 8px 30px rgba(255, 181, 71, .35); transform: scale(.85); transition: transform .18s; }
  .card:hover .play-hint, .card:focus-visible .play-hint { opacity: 1; }
  .card:hover .play-hint span { transform: scale(1); }

  .media { position: relative; overflow: hidden; background: var(--bg-2); }
  .media img.cover { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .media .art { position: absolute; inset: 0; display: grid; place-items: center; }
  .media .art img { width: 42%; max-width: 160px; aspect-ratio: 1; object-fit: contain; filter: drop-shadow(0 10px 24px rgba(0, 0, 0, .5)); }
  .media .art b { font: 800 clamp(36px, 6vw, 64px)/1 var(--display); letter-spacing: .04em; color: rgba(255, 255, 255, .9);
    text-shadow: 0 6px 30px rgba(0, 0, 0, .4); }
  .badge { position: absolute; top: 10px; left: 10px; z-index: 2; font: 800 10.5px/1 var(--display); letter-spacing: .16em;
    padding: 6px 8px; border-radius: 6px; background: var(--amber); color: #1a1205; }
  .badge.upd { background: var(--cyan); color: #04202b; }

  .empty { border: 1px dashed var(--line-2); border-radius: var(--radius); padding: 40px 24px; text-align: center; color: var(--muted); }
  .empty h4 { margin: 0 0 6px; color: var(--text); font: 700 18px/1.3 var(--display); }
  .empty code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; color: var(--text); }

  footer { margin-top: 56px; color: var(--dim); font-size: 12.5px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

  /* player */
  #player { position: fixed; inset: 0; z-index: 50; background: #000; display: none; flex-direction: column; }
  #player.open { display: flex; }
  .pbar { height: 48px; flex: none; display: flex; align-items: center; gap: 6px; padding: 0 8px;
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .pbar .title { display: flex; align-items: center; gap: 10px; min-width: 0; margin: 0 auto 0 4px; }
  .pbar .title img { width: 24px; height: 24px; border-radius: 6px; object-fit: cover; }
  .pbar .title strong { font: 700 14.5px/1 var(--display); letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ibtn { height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border-radius: 8px; border: 1px solid transparent; background: none; cursor: pointer; color: var(--muted); font-size: 13px; font-weight: 600;
    text-decoration: none; }
  .ibtn:hover { background: var(--panel-2); color: var(--text); border-color: var(--line); }
  .stage { position: relative; flex: 1; min-height: 0; }
  .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #000; }
  .loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .3s; z-index: 1; }
  .loading.done { opacity: 0; pointer-events: none; }
  .spinner { width: 38px; height: 38px; border-radius: 50%; border: 3px solid var(--line-2); border-top-color: var(--amber);
    animation: spin .8s linear infinite; margin: 0 auto 14px; }
  .loading p { margin: 0; color: var(--muted); font-size: 13px; text-align: center; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 820px) {
    .hero { grid-template-columns: 1fr; }
    .hero .media { aspect-ratio: 16 / 9; min-height: 0; }
    .hero .media::after { background: linear-gradient(180deg, transparent 50%, var(--panel) 100%); }
    .hero .info { padding: 4px 22px 24px; }
    .search { flex: 1 1 100%; order: 3; }
    .pbar .lbl { display: none; }
  }
  @media (max-width: 520px) {
    .wrap { padding: 0 16px 48px; }
    .seg button { padding: 0 9px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>

<div class="wrap" id="home">
  <header class="top">
    <a class="brand" href="#" aria-label="Home">
      <span class="mark" aria-hidden="true">
        <svg width="26" height="26" viewBox="0 0 64 64"><path d="M28 20a12 12 0 1 0 0 24" fill="none" stroke="#ffb547" stroke-width="6" stroke-linecap="round"/><path d="M46 20a12 12 0 1 0 0 24" fill="none" stroke="#53d5ff" stroke-width="6" stroke-linecap="round"/></svg>
      </span>
      <span><h1 id="siteTitle">CCStudios <span>Arcade</span></h1><p id="tagline"></p></span>
    </a>
    <label class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search games" autocomplete="off" aria-label="Search games">
      <kbd>/</kbd>
    </label>
    <div class="seg" role="group" aria-label="Sort">
      <button data-sort="recent" aria-pressed="true">Newest</button>
      <button data-sort="played" aria-pressed="false">Played</button>
      <button data-sort="az" aria-pressed="false">A–Z</button>
    </div>
  </header>

  <section id="hero" class="hero" hidden></section>

  <div class="bar"><h3>All games <b id="count"></b></h3></div>
  <div id="grid" class="grid"></div>

  <footer><span>© <span id="year"></span> Cousin Crew Studios</span><span id="stamp"></span></footer>
</div>

<div id="player" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="pbar">
    <button class="ibtn" id="pBack" title="Back to games (Alt+←)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg><span class="lbl">Games</span>
    </button>
    <div class="title"><img id="pIcon" alt="" hidden><strong id="pTitle"></strong><span id="pBy"></span></div>
    <button class="ibtn" id="pReload" title="Restart game">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span class="lbl">Restart</span>
    </button>
    <a class="ibtn" id="pNew" target="_blank" rel="noopener" title="Open on its own page (use this for VR)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg><span class="lbl">New tab</span>
    </a>
    <button class="ibtn" id="pFull" title="Fullscreen (F11 also works)">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Fullscreen</span>
    </button>
  </div>
  <div class="stage">
    <div class="loading" id="pLoading"><div><div class="spinner"></div><p id="pLoadText">Loading…</p></div></div>
    <iframe id="frame" title="Game" allow="fullscreen; autoplay; gamepad; xr-spatial-tracking; clipboard-write; screen-wake-lock" allowfullscreen></iframe>
  </div>
</div>

<script>
(function () {
  'use strict';
  var DAY = 864e5;
  var state = { games: [], sort: 'recent', q: '' };
  var $ = function (id) { return document.getElementById(id); };

  // per-viewer conveniences only; the site works fine without storage
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  };
  var played = store.get('cca-played', {});
  state.sort = store.get('cca-sort', 'recent');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function hue(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h % 360; }
  function initials(t) {
    var w = t.replace(/[^A-Za-z0-9 ]/g, ' ').split(/\s+/).filter(Boolean);
    return (w.length > 1 ? w[0][0] + w[1][0] : (w[0] || '?').slice(0, 2)).toUpperCase();
  }
  function ago(ms) {
    var d = (Date.now() - ms) / DAY;
    if (d < 1 / 24) return 'just now';
    if (d < 1) return Math.round(d * 24) + 'h ago';
    if (d < 30) return Math.round(d) + 'd ago';
    if (d < 365) return Math.round(d / 30) + 'mo ago';
    return Math.round(d / 365) + 'y ago';
  }
  function badge(g) {
    if (Date.now() - g.added < 14 * DAY) return '<span class="badge">NEW</span>';
    if (Date.now() - g.updated < 7 * DAY && g.updated - g.added > DAY) return '<span class="badge upd">UPDATED</span>';
    return '';
  }
  function media(g, cls) {
    var h = hue(g.slug);
    var bg = 'background:radial-gradient(120% 90% at 30% 20%,hsl(' + h + ' 70% 38%),hsl(' + ((h + 40) % 360) + ' 60% 12%) 70%)';
    var inner = g.cover
      ? '<img class="cover" src="' + esc(g.cover) + '" alt="" loading="lazy" decoding="async">'
      : '<div class="art" style="' + bg + '">' + (g.icon
          ? '<img src="' + esc(g.icon) + '" alt="" loading="lazy" decoding="async">'
          : '<b>' + esc(initials(g.title)) + '</b>') + '</div>';
    return '<div class="media ' + (cls || '') + '">' + inner + '</div>';
  }

  function credit(g, link) {
    if (!g.author) return '';
    var who = 'by ' + esc(g.author);
    return link && g.authorUrl
      ? '<a class="by" href="' + esc(g.authorUrl) + '" target="_blank" rel="noopener">' + who + '</a>'
      : '<span class="by">' + who + '</span>';
  }

  function sorted() {
    var list = state.games.slice();
    var q = state.q.trim().toLowerCase();
    if (q) list = list.filter(function (g) {
      return (g.title + ' ' + g.description + ' ' + (g.tags || []).join(' ') + ' ' + (g.author || '') + ' ' + g.folder).toLowerCase().indexOf(q) >= 0;
    });
    if (state.sort === 'az') list.sort(function (a, b) { return a.title.localeCompare(b.title); });
    else if (state.sort === 'played') list.sort(function (a, b) { return (played[b.slug] || 0) - (played[a.slug] || 0) || b.updated - a.updated; });
    else list.sort(function (a, b) { return (a.order == null ? 1e9 : a.order) - (b.order == null ? 1e9 : b.order) || b.updated - a.updated; });
    return list;
  }

  function renderHero() {
    var hero = $('hero');
    // featured: explicit order first, else most recently updated
    var g = state.games.slice().sort(function (a, b) {
      return (a.order == null ? 1e9 : a.order) - (b.order == null ? 1e9 : b.order) || b.updated - a.updated;
    })[0];
    if (!g) { hero.hidden = true; return; }
    var fresh = Date.now() - g.added < 14 * DAY ? 'New release' : 'Latest update';
    hero.innerHTML = media(g) +
      '<div class="info"><div class="eyebrow">' + fresh + '</div><h2>' + esc(g.title) + '</h2>' + credit(g, true) +
      (g.description ? '<p>' + esc(g.description) + '</p>' : '') +
      '<div class="actions"><button class="btn primary" data-play="' + esc(g.slug) + '">' +
      '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg>Play now</button>' +
      '<span class="meta">Updated ' + ago(g.updated) + '</span></div></div>';
    hero.hidden = false;
  }

  function renderGrid() {
    var list = sorted();
    $('count').textContent = state.games.length ? '· ' + (state.q ? list.length + ' of ' : '') + state.games.length : '';
    if (!list.length) {
      $('grid').innerHTML = state.games.length
        ? '<div class="empty" style="grid-column:1/-1"><h4>No games match “' + esc(state.q) + '”</h4>Try a different search.</div>'
        : '';
      return;
    }
    $('grid').innerHTML = list.map(function (g) {
      var tags = (g.tags || []).slice(0, 3).map(function (t) { return '<span class="tag">' + esc(t) + '</span>'; }).join('');
      var when = played[g.slug] && state.sort === 'played' ? 'Played ' + ago(played[g.slug]) : 'Updated ' + ago(g.updated);
      return '<button class="card" data-play="' + esc(g.slug) + '" aria-label="Play ' + esc(g.title) + '">' +
        '<div style="position:relative">' + badge(g) + media(g) +
        '<div class="play-hint" aria-hidden="true"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="#1a1205"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12.5-7.5a1 1 0 0 0 0-1.72L8.5 3.64A1 1 0 0 0 7 4.5z"/></svg></span></div></div>' +
        '<div class="body"><h4>' + esc(g.title) + '</h4>' + credit(g, false) + (g.description ? '<p>' + esc(g.description) + '</p>' : '') +
        '<div class="foot">' + tags + '<span class="when">' + when + '</span></div></div></button>';
    }).join('');
  }

  function render() { renderHero(); renderGrid(); }

  // ---- player ----
  var current = null;
  function open(slug) {
    var g = state.games.filter(function (x) { return x.slug === slug; })[0];
    if (!g) { close(); return; }
    current = g;
    played[g.slug] = Date.now(); store.set('cca-played', played);
    document.title = g.title + ' · ' + (state.site.title || 'CCStudios Arcade');
    $('pTitle').textContent = g.title;
    $('pBy').innerHTML = credit(g, true);
    var ic = g.icon || g.cover;
    $('pIcon').hidden = !ic; if (ic) $('pIcon').src = ic;
    $('pNew').href = g.url;
    $('pLoadText').textContent = 'Loading ' + g.title + '…';
    $('pLoading').classList.remove('done');
    var f = $('frame');
    if (f.getAttribute('src') !== g.url) f.src = g.url;
    else $('pLoading').classList.add('done');
    $('player').classList.add('open');
    document.body.classList.add('playing');
  }
  function close() {
    current = null;
    $('player').classList.remove('open');
    document.body.classList.remove('playing');
    $('frame').src = 'about:blank'; // unloads the game (stops its audio and loops)
    document.title = state.site ? state.site.title : 'CCStudios Arcade';
    if (state.games.length) renderGrid();
  }
  function route() {
    var m = location.hash.match(/^#play\/(.+)$/);
    if (m) open(decodeURIComponent(m[1])); else if (current) close();
  }

  $('frame').addEventListener('load', function () {
    if (!current) return;
    $('pLoading').classList.add('done');
    try { $('frame').contentWindow.focus(); } catch (e) { $('frame').focus(); }
  });
  $('pBack').addEventListener('click', function () {
    if (history.state && history.state.cca) history.back(); else location.hash = '';
  });
  $('pReload').addEventListener('click', function () {
    if (!current) return;
    $('pLoading').classList.remove('done');
    try { $('frame').contentWindow.location.reload(); } catch (e) { $('frame').src = current.url; }
  });
  $('pFull').addEventListener('click', function () {
    var f = $('frame');
    var req = f.requestFullscreen || f.webkitRequestFullscreen;
    if (req) req.call(f);
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-play]');
    if (!b) return;
    history.pushState({ cca: 1 }, '', '#play/' + encodeURIComponent(b.getAttribute('data-play')));
    route();
  });
  window.addEventListener('popstate', route);
  window.addEventListener('hashchange', route);
  document.addEventListener('keydown', function (e) {
    if (current) {
      if (e.altKey && e.key === 'ArrowLeft') { e.preventDefault(); $('pBack').click(); }
      return;
    }
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
    if (e.key === 'Escape' && document.activeElement === $('q')) { $('q').value = ''; state.q = ''; renderGrid(); $('q').blur(); }
  });

  // ---- controls ----
  $('q').addEventListener('input', function () { state.q = this.value; renderGrid(); });
  [].forEach.call(document.querySelectorAll('.seg button'), function (b) {
    b.setAttribute('aria-pressed', String(b.dataset.sort === state.sort));
    b.addEventListener('click', function () {
      state.sort = b.dataset.sort; store.set('cca-sort', state.sort);
      [].forEach.call(document.querySelectorAll('.seg button'), function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      renderGrid();
    });
  });
  $('year').textContent = new Date().getFullYear();

  // ---- load ----
  state.site = {};
  fetch('games.json', { cache: 'no-cache' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) {
      state.site = data.site || {};
      state.games = data.games || [];
      if (state.site.title) {
        var parts = state.site.title.split(' ');
        var last = parts.pop();
        $('siteTitle').innerHTML = esc(parts.join(' ')) + (parts.length ? ' ' : '') + '<span>' + esc(last) + '</span>';
        document.title = state.site.title;
      }
      $('tagline').textContent = state.site.tagline || '';
      if (data.generated) $('stamp').textContent = 'Updated ' + new Date(data.generated).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      if (!state.games.length) {
        $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h4>No games yet</h4>Drop a game folder into <code>games/</code> and run <code>publish.bat</code>.</div>';
      }
      render();
      route();
    })
    .catch(function () {
      var local = location.protocol === 'file:';
      $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1"><h4>' + (local ? 'Open this with preview.bat' : 'Game list not found') + '</h4>' +
        (local ? 'Browsers block reading <code>games.json</code> from a double-clicked file. Double-click <code>preview.bat</code> instead.'
               : '<code>games.json</code> is missing. Run <code>publish.bat</code> to rebuild and upload it.') + '</div>';
    });
})();
</script>
</body>
</html>
